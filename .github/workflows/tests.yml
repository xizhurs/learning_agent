name: tests

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  pytest:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uvx black==26.10.1 --check src tests
      - run: uvx ruff@0.17.3 check src tests
      - run: uv sync --frozen
      - run: uv run pytest -q
