<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon Methodology Chat</title>
<style>
  :root { --bg:#f6f7f5; --panel:#fff; --ink:#1d2421; --muted:#68726c; --line:#dfe3df; --accent:#2f6b4f; --user:#e6f0ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141816; --panel:#1c211e; --ink:#e6ebe7; --muted:#97a39b; --line:#2d3430; --accent:#6fb996; --user:#24332b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  header label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  select, input[type=number], textarea, button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  input[type=number] { width:56px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; max-width:860px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); white-space:pre-wrap; }
  .msg.user { background:var(--user); align-self:flex-end; max-width:80%; }
  .msg.err { border-color:#c0392b; }
  details { margin-top:8px; font-size:13px; color:var(--muted); white-space:normal; }
  details summary { cursor:pointer; }
  .src { margin:6px 0; padding:6px 8px; border-left:3px solid var(--accent); background:var(--bg); }
  .src b { color:var(--ink); }
  .src pre { margin:4px 0 0; white-space:pre-wrap; font:12px/1.4 ui-monospace, Consolas, monospace; max-height:160px; overflow:auto; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); max-width:none; }
  form textarea { flex:1; resize:none; max-width:820px; margin-left:auto; }
  form button { background:var(--accent); color:#fff; border:0; padding:8px 18px; cursor:pointer; margin-right:auto; }
  form button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1>Carbon Methodology Chat</h1>
  <label>Search <select id="mode"><option>hybrid</option><option>vector</option><option>fts</option></select></label>
  <label><input type="checkbox" id="rerank" checked> Rerank</label>
  <label>Top-k <input type="number" id="topk" min="1" max="12" value="5"></label>
  <label>Document <select id="source"><option value="">all</option></select></label>
  <button id="clear" type="button">New chat</button>
  <span id="model" style="color:var(--muted);font-size:12px"></span>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="q" rows="2" placeholder="Ask about the methodology or the project description..." autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
const $ = id => document.getElementById(id);
let history = [];

function add(role, text = "") {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function renderSources(bubble, sources) {
  if (!sources.length) return;
  const det = document.createElement("details");
  det.innerHTML = `<summary>${sources.length} sources</summary>`;
  for (const s of sources) {
    const el = document.createElement("div");
    el.className = "src";
    el.innerHTML = `<b>[${s.n}]</b> `;
    el.append(`${s.citation} (score ${s.score}, ${s.kind})`);
    const pre = document.createElement("pre");
    pre.textContent = s.text;
    el.appendChild(pre);
    det.appendChild(el);
  }
  bubble.appendChild(det);
}

const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));

function renderTiming(bubble, d) {
  if (!d || typeof d !== "object") return;
  const steps = Object.entries(d.timings || {}).filter(([k]) => k !== "total").map(([k, v]) => `${k} ${v}s`).join(", ");
  const el = document.createElement("div");
  el.className = "src";
  el.textContent = `${d.seconds}s total` + (steps ? ` (${steps})` : "") + (d.trace_id ? ` - trace ${d.trace_id.slice(0, 8)} in Phoenix (localhost:6006)` : "");
  bubble.appendChild(el);
}

async function ask(question) {
  add("user", question);
  const bubble = add("bot", "");
  const answer = document.createElement("span");
  bubble.appendChild(answer);
  const body = {
    question, history: history.slice(-6),
    mode: $("mode").value, rerank: $("rerank").checked,
    top_k: parseInt($("topk").value) || null, source: $("source").value || null,
    session_id: sessionId,
  };
  $("send").disabled = true;
  let text = "";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /event: (.*)/.exec(chunk)?.[1];
        const data = JSON.parse(/data: (.*)/s.exec(chunk)[1]);
        if (ev === "sources") renderSources(bubble, data);
        else if (ev === "token") { text += data; answer.textContent = text; $("log").scrollTop = $("log").scrollHeight; }
        else if (ev === "done") renderTiming(bubble, data);
        else if (ev === "error") { bubble.classList.add("err"); answer.textContent += "\nError: " + data; }
      }
    }
    history.push({ role: "user", content: question }, { role: "assistant", content: text });
  } catch (e) {
    bubble.classList.add("err");
    answer.textContent = "Error: " + e.message;
  } finally {
    $("send").disabled = false;
  }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q || $("send").disabled) return;
  $("q").value = "";
  ask(q);
});
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("clear").addEventListener("click", () => { history = []; $("log").innerHTML = ""; });

fetch("/api/config").then(r => r.json()).then(c => {
  $("mode").value = c.retrieval.mode; $("rerank").checked = c.rerank.enabled; $("topk").value = c.retrieval.top_k;
  $("model").textContent = c.model;
  for (const s of c.sources) { const o = document.createElement("option"); o.value = o.textContent = s; $("source").appendChild(o); }
});
</script>
</body>
</html>
